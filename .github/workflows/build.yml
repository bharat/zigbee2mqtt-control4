name: Build and push image

on:
  push:
    branches: [main]
  # Weekly rebuild so the image tracks upstream koenkk/zigbee2mqtt:latest.
  # The Dockerfile's version-skew assertion fails the build loudly if a new
  # base pins herdsman/converters versions the forks have not been rebased
  # onto, so a silent drift cannot ship.
  schedule:
    - cron: "26 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bharat/zigbee2mqtt-control4

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # latest is the canonical tag; sha tags are immutable rollback anchors.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
